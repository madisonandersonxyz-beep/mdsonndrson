<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover Your Next Favorite Find</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F7F4F0;
      color: #111111;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #FFFFFF;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.03);
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Categories sa taas (Scrollable Tabs) */
    .top-choices {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .top-choices::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 1px solid #E0E0E0;
      border-radius: 99px;
      background-color: #FAFAFA;
      color: #555555;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #111111;
      color: #FFFFFF;
      border-color: #111111;
    }

    /* 1 Column Grid para sa mga Category */
    .categories-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .category-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #E8E2DA;
      border-radius: 8px;
      background-color: #FAFAF8;
      color: #111111;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
    }

    .category-btn:active {
      background-color: #EFECE6;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 11px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Catalog</h1>
    </header>

    <!-- Top Navigation Tabs -->
    <div class="top-choices" id="topChoices">
      <button class="tab-btn active" data-cat="all">All</button>
      <button class="tab-btn" data-cat="face">Face</button>
      <button class="tab-btn" data-cat="eyes">Eyes</button>
      <button class="tab-btn" data-cat="lips">Lips</button>
      <button class="tab-btn" data-cat="tools">Tools</button>
      <button class="tab-btn" data-cat="remover">Remover</button>
    </div>

    <!-- Category List na purong pangalan lang ng category at nakaka-link sa hiwalay na HTML -->
    <div class="categories-list" id="categoriesList"></div>

    <footer>
      Affiliate Disclosure: Commissions earned on qualifying US links.
    </footer>
  </div>

  <script>
    const makeupCategories = [
      // Face
      { category: "face", title: "Foundation", link: "foundation/foundation.html" },
      { category: "face", title: "Concealer", link: "concealer/concealer.html" },
      { category: "face", title: "BB / CC Cream", link: "bb-cc-cream/bb-cc-cream.html" },
      { category: "face", title: "Primer", link: "primer/primer.html" },
      { category: "face", title: "Face Powder", link: "face-powder/face-powder.html" },
      { category: "face", title: "Blush", link: "blushblush.html" },
      { category: "face", title: "Highlighter", link: "highlighter/highlighter.html" },
      { category: "face", title: "Contour", link: "countour/contour.html" },
      { category: "face", title: "Setting Spray", link: "setting-spray/setting-spray.html" },

      // Eyes
      { category: "eyes", title: "Eyebrow Pencil", link: "eyebrow-pencil/eyebrow-pencil.html" },
      { category: "eyes", title: "Eyebrow Gel", link: "eyebrow-gel/eyebrow-gel.html" },
      { category: "eyes", title: "Eyeshadow", link: "eyeshadow/eyeshadow.html" },
      { category: "eyes", title: "Eyeliner", link: "eyeliner.html" },
      { category: "eyes", title: "Mascara", link: "mascara.html" },
      { category: "eyes", title: "False Eyelashes", link: "false-eyelashes.html" },

      // Lips
      { category: "lips", title: "Lipstick", link: "lipstick.html" },
      { category: "lips", title: "Lip Tint", link: "lip-tint.html" },
      { category: "lips", title: "Lip Gloss", link: "lip-gloss.html" },
      { category: "lips", title: "Lip Balm", link: "lip-balm.html" },
      { category: "lips", title: "Lip Liner", link: "lip-liner.html" },
      { category: "lips", title: "Lip Matte", link: "lip-matte.html" },

      // Tools
      { category: "tools", title: "Makeup Brush", link: "makeup-brush.html" },
      { category: "tools", title: "Beauty Blender", link: "beauty-blender.html" },
      { category: "tools", title: "Makeup Sponge", link: "makeup-sponge.html" },
      { category: "tools", title: "Eyelash Curler", link: "eyelash-curler.html" },
      { category: "tools", title: "Organizer", link: "organizer.html" },
      { category: "tools", title: "Makeup Mirror", link: "makeup-mirror.html" },

      // Remover
      { category: "remover", title: "Micellar Water", link: "micellar-water.html" },
      { category: "remover", title: "Cleansing Balm", link: "cleansing-balm.html" },
      { category: "remover", title: "Remover Wipes", link: "remover-wipes.html" },
      { category: "remover", title: "Cleansing Oil", link: "cleansing-oil.html" }
    ];

    const list = document.getElementById("categoriesList");
    const buttons = document.querySelectorAll(".tab-btn");

    function renderChoices(selectedCat = "all") {
      const filtered = selectedCat === "all"
        ? makeupCategories
        : makeupCategories.filter(item => item.category === selectedCat);

      list.innerHTML = filtered.map(item => `
        <a href="${item.link}" class="category-btn">
          <span>${item.title}</span>
          <span>→</span>
        </a>
      `).join("");
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderChoices(btn.dataset.cat);
      });
    });

    renderChoices();
  </script>
</body>
</html>
