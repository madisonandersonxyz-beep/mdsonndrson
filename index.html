<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOW EDIT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F7F4F0;
      color: #111111;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #FFFFFF;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.03);
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* Back button kapag nasa loob ng sub-choices */
    .back-bar {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .back-bar.show {
      display: flex;
    }

    /* Categories sa taas (Scrollable) */
    .top-choices {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .top-choices::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 1px solid #E0E0E0;
      border-radius: 99px;
      background-color: #FAFAFA;
      color: #555555;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #111111;
      color: #FFFFFF;
      border-color: #111111;
    }

    /* 2 Columns Grid sa Mobile para sa mga Choices */
    .choices-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #E8E2DA;
      border-radius: 8px;
      background-color: #FAFAF8;
      color: #111111;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .choice-btn:active {
      background-color: #EFECE6;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 11px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 onclick="resetView()">GLOW EDIT</h1>
    </header>

    <!-- Back button kapag nasa sub-menu -->
    <button class="back-bar" id="backBtn" onclick="resetView()">← Back to Categories</button>

    <!-- Categories sa taas -->
    <div class="top-choices" id="topChoices">
      <button class="tab-btn active" data-cat="all">All</button>
      <button class="tab-btn" data-cat="face">Face</button>
      <button class="tab-btn" data-cat="eyes">Eyes</button>
      <button class="tab-btn" data-cat="lips">Lips</button>
      <button class="tab-btn" data-cat="tools">Tools</button>
      <button class="tab-btn" data-cat="remover">Remover</button>
      <button class="tab-btn" data-cat="sets">Sets</button>
    </div>

    <!-- Product Choices List (2 Columns Grid) -->
    <div class="choices-list" id="choicesList"></div>

    <footer>
      Affiliate Disclosure: Commissions earned on qualifying US links.
    </footer>
  </div>

      ],
      travel_kit: [

    };

    const list = document.getElementById("choicesList");
    const buttons = document.querySelectorAll(".tab-btn");
    const backBtn = document.getElementById("backBtn");
    const topChoicesBar = document.getElementById("topChoices");

    let activeCategory = "all";

    function renderMainChoices(selectedCat = "all") {
      backBtn.classList.remove("show");
      topChoicesBar.style.display = "flex";
      activeCategory = selectedCat;

      const itemsToDisplay = selectedCat === "all"
        ? featuredChoices
        : makeupCategories.filter(item => item.category === selectedCat);

      list.innerHTML = itemsToDisplay.map(item => `
        <button class="choice-btn" onclick="openSubChoices('${item.subKey}', '${item.title}')">
          <span>${item.title}</span>
          <span>→</span>
        </button>
      `).join("");
    }

    function openSubChoices(subKey, titleName) {
      backBtn.classList.add("show");
      topChoicesBar.style.display = "none";

      const items = subChoicesData[subKey] || [];

      if (items.length === 0) {
        list.innerHTML = `
          <div style="grid-column: 1 / -1; font-size: 13px; color: #777; text-align: center; padding: 20px;">
            Wala pang choices para dito. Pwede mong idagdag sa code!
          </div>
        `;
        return;
      }

      list.innerHTML = `
        <div style="grid-column: 1 / -1; font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #333;">
          ${titleName} Choices:
        </div>
      ` + items.map(sub => `
        <a href="${sub.link}" target="_blank" rel="nofollow sponsored noopener" class="choice-btn">
          <span>${sub.title}</span>
          <span>↗</span>
        </a>
      `).join("");
    }

    function resetView() {
      renderMainChoices(activeCategory);
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderMainChoices(btn.dataset.cat);
      });
    });

    renderMainChoices();
  </script>
</body>
</html>
