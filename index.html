<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOW EDIT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Dito pinalitan ang background ng buong screen (soft warm nude/beige) */
      background-color: #F7F4F0;
      color: #111111;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #FFFFFF;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.03);
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Categories sa taas (Scrollable) */
    .top-choices {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .top-choices::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 1px solid #E0E0E0;
      border-radius: 99px;
      background-color: #FAFAFA;
      color: #555555;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #111111;
      color: #FFFFFF;
      border-color: #111111;
    }

    /* 2 Columns Grid sa Mobile para sa mga Choices */
    .choices-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #E8E2DA;
      border-radius: 8px;
      background-color: #FAFAF8;
      color: #111111;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
    }

    .choice-btn:active {
      background-color: #EFECE6;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 11px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GLOW EDIT</h1>
    </header>

    <!-- Categories sa taas -->
    <div class="top-choices" id="topChoices">
      <button class="tab-btn active" data-cat="all">All</button>
      <button class="tab-btn" data-cat="face">Face</button>
      <button class="tab-btn" data-cat="eyes">Eyes</button>
      <button class="tab-btn" data-cat="lips">Lips</button>
      <button class="tab-btn" data-cat="tools">Tools & Accessories</button>
      <button class="tab-btn" data-cat="remover">Makeup Remover</button>
      <button class="tab-btn" data-cat="sets">Sets & Kits</button>
    </div>

    <!-- Product Choices List (2 Columns Grid) -->
    <div class="choices-list" id="choicesList"></div>

    <footer>
      Affiliate Disclosure: Commissions earned on qualifying US links.
    </footer>
  </div>

  <script>
    const makeupChoices = [
      // 1. Face Makeup
      { category: "face", title: "Foundation", link: "https://www.sephora.com/" },
      { category: "face", title: "Concealer", link: "https://www.sephora.com/" },
      { category: "face", title: "BB / CC Cream", link: "https://www.ulta.com/" },
      { category: "face", title: "Primer", link: "https://www.sephora.com/" },
      { category: "face", title: "Face Powder", link: "https://www.ulta.com/" },
      { category: "face", title: "Blush", link: "https://www.sephora.com/" },
      { category: "face", title: "Highlighter", link: "https://www.sephora.com/" },
      { category: "face", title: "Contour", link: "https://www.sephora.com/" },
      { category: "face", title: "Setting Spray", link: "https://www.ulta.com/" },

      // 2. Eye Makeup
      { category: "eyes", title: "Eyebrow Pencil", link: "https://www.amazon.com/" },
      { category: "eyes", title: "Eyebrow Gel", link: "https://www.amazon.com/" },
      { category: "eyes", title: "Eyeshadow", link: "https://www.sephora.com/" },
      { category: "eyes", title: "Eyeliner", link: "https://www.ulta.com/" },
      { category: "eyes", title: "Mascara", link: "https://www.amazon.com/" },
      { category: "eyes", title: "False Eyelashes", link: "https://www.amazon.com/" },

      // 3. Lip Makeup
      { category: "lips", title: "Lipstick", link: "https://www.sephora.com/" },
      { category: "lips", title: "Lip Tint", link: "https://www.ulta.com/" },
      { category: "lips", title: "Lip Gloss", link: "https://www.sephora.com/" },
      { category: "lips", title: "Lip Balm", link: "https://www.amazon.com/" },
      { category: "lips", title: "Lip Liner", link: "https://www.ulta.com/" },
      { category: "lips", title: "Lip Matte", link: "https://www.sephora.com/" },

      // 4. Makeup Tools & Accessories
      { category: "tools", title: "Makeup Brush", link: "https://www.amazon.com/" },
      { category: "tools", title: "Beauty Blender", link: "https://www.amazon.com/" },
      { category: "tools", title: "Makeup Sponge", link: "https://www.amazon.com/" },
      { category: "tools", title: "Eyelash Curler", link: "https://www.amazon.com/" },
      { category: "tools", title: "Organizer", link: "https://www.amazon.com/" },
      { category: "tools", title: "Makeup Mirror", link: "https://www.amazon.com/" },

      // 5. Makeup Remover
      { category: "remover", title: "Micellar Water", link: "https://www.amazon.com/" },
      { category: "remover", title: "Cleansing Balm", link: "https://www.ulta.com/" },
      { category: "remover", title: "Remover Wipes", link: "https://www.amazon.com/" },
      { category: "remover", title: "Cleansing Oil", link: "https://www.ulta.com/" },

      // 6. Makeup Sets & Kits
      { category: "sets", title: "Complete Set", link: "https://www.amazon.com/" },
      { category: "sets", title: "Eyeshadow Palette", link: "https://www.sephora.com/" },
      { category: "sets", title: "Lipstick Set", link: "https://www.sephora.com/" },
      { category: "sets", title: "Travel Kit", link: "https://www.amazon.com/" }
    ];

    const list = document.getElementById("choicesList");
    const buttons = document.querySelectorAll(".tab-btn");

    function renderChoices(selectedCat = "all") {
      const filtered = selectedCat === "all"
        ? makeupChoices
        : makeupChoices.filter(item => item.category === selectedCat);

      list.innerHTML = filtered.map(item => `
        <a href="${item.link}" target="_blank" rel="nofollow sponsored noopener" class="choice-btn">
          <span>${item.title}</span>
          <span>→</span>
        </a>
      `).join("");
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderChoices(btn.dataset.cat);
      });
    });

    renderChoices();
  </script>
</body>
</html>
