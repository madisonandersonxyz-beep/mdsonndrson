<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOW EDIT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAFAFA;
      color: #111111;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #FFFFFF;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Choices sa taas (Category Tabs) */
    .top-choices {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #E0E0E0;
      border-radius: 99px;
      background-color: #FFFFFF;
      color: #555555;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #111111;
      color: #FFFFFF;
      border-color: #111111;
    }

    /* Listahan ng Affiliate Links */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background-color: #FFFFFF;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .choice-btn:active {
      background-color: #F2F2F2;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 11px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GLOW EDIT</h1>
    </header>

    <!-- Choices sa taas -->
    <div class="top-choices" id="topChoices">
      <button class="tab-btn active" data-cat="all">All</button>
      <button class="tab-btn" data-cat="face">Face</button>
      <button class="tab-btn" data-cat="lips">Lips</button>
      <button class="tab-btn" data-cat="eyes">Eyes</button>
    </div>

    <!-- Product Choices -->
    <div class="choices-list" id="choicesList"></div>

    <footer>
      Affiliate Disclosure: Commissions earned on qualifying US links.
    </footer>
  </div>

  <script>
    // PALITAN O DAGDAGAN LANG ANG CHOICES AT AFFILIATE LINKS MO DITO
    // Ang category ay pwedeng: "face", "lips", o "eyes"
    const makeupChoices = [
      { category: "face", title: "Rare Beauty — Soft Pinch Liquid Blush", link: "https://www.sephora.com/" },
      { category: "lips", title: "Summer Fridays — Lip Butter Balm", link: "https://www.sephora.com/" },
      { category: "face", title: "e.l.f. Cosmetics — Halo Glow Liquid Filter", link: "https://www.ulta.com/" },
      { category: "eyes", title: "Tower 28 — MakeWaves Mascara", link: "https://www.amazon.com/" },
      { category: "lips", title: "NYX — Fat Oil Lip Drip Gloss", link: "https://www.amazon.com/" },
      { category: "face", title: "Kosås — Revealer Concealer", link: "https://www.sephora.com/" }
    ];

    const list = document.getElementById("choicesList");
    const buttons = document.querySelectorAll(".tab-btn");

    function renderChoices(selectedCat = "all") {
      const filtered = selectedCat === "all"
        ? makeupChoices
        : makeupChoices.filter(item => item.category === selectedCat);

      list.innerHTML = filtered.map(item => `
        <a href="${item.link}" target="_blank" rel="nofollow sponsored noopener" class="choice-btn">
          <span>${item.title}</span>
          <span>→</span>
        </a>
      `).join("");
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderChoices(btn.dataset.cat);
      });
    });

    renderChoices();
  </script>
</body>
</html>
